name: Build HASSAN PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q HASSAN-PRO-APK-BUILD.zip -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find project -type f -name gradlew -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $ANDROID_DIR"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Make Gradle executable
        run: chmod +x "$ANDROID_DIR/gradlew"

      - name: Build APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find "$ANDROID_DIR" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: HASSAN-PRO-APK
          path: ${{ env.APK }}
          if-no-files-found: error
